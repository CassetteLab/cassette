name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets the macOS half be re-run on its own, without pushing a tag — so a failure here can be
  # retried without waking Xcode Cloud and adding a duplicate TestFlight build for a version that
  # already has one. Give it the version of an EXISTING tag to publish onto; leave it empty for a
  # dry run that builds, notarises and hashes but publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version to publish, e.g. 1.11.0. Empty = dry run, publishes nothing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-26
    env:
      APP_NAME: Cassette
      SCHEME: Cassette
      PROJECT: Cassette.xcodeproj
      APPLE_TEAM_ID: LK2358MPL8
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Derive version from tag or dispatch input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # `publish` gates every step that writes somewhere permanent. A dispatch with no version
          # is therefore a full rehearsal — archive, export, notarise, DMG, checksums — that leaves
          # no trace, which is the only way to exercise this workflow without burning a tag.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            PUBLISH=true
          else
            VERSION="0.0.0-dev"
            PUBLISH=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (publish=$PUBLISH)"

      - name: Build unsigned iOS .ipa (for sideloading)
        run: |
          IPA="$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.ipa"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME-iOS.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          # No signing certificate: package the .app into an unsigned .ipa (Payload/). Users install it by
          # sideloading (AltStore / Sideloadly), which re-signs with their own Apple ID.
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_NAME-iOS.xcarchive/Products/Applications/$APP_NAME.app" Payload/
          zip -qry "$IPA" Payload
          rm -rf Payload

      - name: Import Developer ID certificate into a temp keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Write App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Install Developer ID provisioning profiles
        env:
          PROVISION_PROFILE_APP_BASE64: ${{ secrets.PROVISION_PROFILE_APP_BASE64 }}
          PROVISION_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISION_PROFILE_WIDGET_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISION_PROFILE_APP_BASE64" | base64 --decode > "$PROFILES_DIR/cassette_app.provisionprofile"
          echo "$PROVISION_PROFILE_WIDGET_BASE64" | base64 --decode > "$PROFILES_DIR/cassette_widget.provisionprofile"

      - name: Archive (macOS, unsigned — Developer ID applied at export)
        run: |
          # Nothing is signed here. Manual signing at archive time needs a
          # PROVISIONING_PROFILE_SPECIFIER per target, and a command-line build setting applies to
          # every target at once — but the app and the widget extension need two different profiles,
          # and both carry App Groups, which only a matching profile can authorise. That is what
          # failed on v1.11.0: "requires a provisioning profile with the App Groups feature".
          #
          # ExportOptions-DeveloperID.plist already maps each bundle id to its own profile, so the
          # export below is the right place to sign. Still no -allowProvisioningUpdates: CI mints no
          # certificate and cannot hit the account's cert cap, which is why archive-time signing was
          # introduced in the first place.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export Developer ID app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions-DeveloperID.plist

      - name: Notarize + staple the .app
        run: |
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/$APP_NAME.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/$APP_NAME.zip"
          xcrun stapler staple "$APP"

      - name: Create .dmg
        run: |
          brew install create-dmg
          DMG="$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.dmg"
          create-dmg \
            --volname "$APP_NAME" \
            --window-size 540 380 \
            --icon-size 120 \
            --icon "$APP_NAME.app" 150 190 \
            --app-drop-link 390 190 \
            --hide-extension "$APP_NAME.app" \
            "$DMG" \
            "$RUNNER_TEMP/export/$APP_NAME.app"

      - name: Notarize + staple the .dmg
        run: |
          DMG="$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.dmg"
          .github/scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      # Computed here, after stapling and before upload: `stapler staple` rewrites the DMG in
      # place, so a hash taken any earlier would not match the file people download. The cask
      # bump below reads these outputs rather than hashing again — one hash, one source.
      - name: Compute artifact checksums
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="$RUNNER_TEMP/$APP_NAME-$VERSION.dmg"
          IPA="$RUNNER_TEMP/$APP_NAME-$VERSION.ipa"
          DMG_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          IPA_SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          echo "dmg_sha=$DMG_SHA" >> "$GITHUB_OUTPUT"
          echo "ipa_sha=$IPA_SHA" >> "$GITHUB_OUTPUT"
          echo "DMG $DMG_SHA"
          echo "IPA $IPA_SHA"

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ${{ runner.temp }}/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
            ${{ runner.temp }}/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.ipa
          generate_release_notes: true

      # Appended after the release exists rather than passed as `body`: the API pre-pends a body
      # to the generated notes, which would put the checksums above the changelog. Failing here
      # costs the section, not the release — the artifacts are already uploaded.
      - name: Append checksums to release notes
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_SHA="${{ steps.checksums.outputs.dmg_sha }}"
          IPA_SHA="${{ steps.checksums.outputs.ipa_sha }}"
          BODY="$(gh release view "$TAG" --json body --jq .body)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $BODY

          ## Checksums (SHA-256)

          \`$DMG_SHA\`  $APP_NAME-$VERSION.dmg
          \`$IPA_SHA\`  $APP_NAME-$VERSION.ipa

          Verify with: \`shasum -a 256 $APP_NAME-$VERSION.dmg\`
          EOF
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Bump Homebrew cask
        if: steps.version.outputs.publish == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.checksums.outputs.dmg_sha }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/CassetteLab/homebrew-cassette.git" tap
          cd tap
          CASK="Casks/cassette.rb"
          /usr/bin/sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" "$CASK"
          /usr/bin/sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" "$CASK"
          if git diff --quiet -- "$CASK"; then
            echo "Cask already at $VERSION — nothing to bump."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$CASK"
            git commit -m "chore(cask): update cassette to $VERSION"
            git push
          fi

      - name: Clean up sensitive files on runner
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
